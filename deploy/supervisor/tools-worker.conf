[program:tools-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/tools/current/artisan queue:work database --queue=default --sleep=2 --tries=1 --timeout=240 --max-time=3600
directory=/var/www/tools/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/tools/current/storage/logs/worker.log
stopwaitsecs=300
