server {
    listen 80;
    server_name tools.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name tools.example.com;
    root /var/www/tools/current/public;
    index index.php;
    client_max_body_size 100m;
    ssl_certificate /etc/letsencrypt/live/tools.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.example.com/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
    }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(?:css|js|svg|woff2)$ { expires 7d; add_header Cache-Control "public, immutable"; }
}
